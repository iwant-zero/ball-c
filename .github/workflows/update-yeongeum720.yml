name: update-yeongeum720-data

on:
  schedule:
    - cron: "10 12 * * *" # 매일 21:10 KST (12:10 UTC)
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  update:
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/update720')
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --dns-result-order=ipv4first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update data
        run: node scripts/update-yeongeum720.mjs

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update yeongeum720 winners data"
          file_pattern: "data/yeongeum720_winners.json update-error.txt"

      - name: Create issue on failure
        if: failure() && github.event_name != 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let body = "연금복권720+ 데이터 업데이트가 실패했습니다.\n\n";
            body += `- 실행 시각(UTC): ${new Date().toISOString()}\n`;
            body += `- 워크플로우: ${process.env.GITHUB_WORKFLOW}\n`;
            body += `- 런 ID: ${process.env.GITHUB_RUN_ID}\n\n`;
            const errPath = path.join(process.env.GITHUB_WORKSPACE, 'update-error.txt');
            if (fs.existsSync(errPath)) {
              body += "```\n" + fs.readFileSync(errPath, 'utf8').slice(0, 6000) + "\n```\n";
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `연금복권720+ 데이터 업데이트 실패 (${new Date().toISOString().slice(0,10)})`,
              body
            });

      - name: Comment back on failure (issue_comment trigger)
        if: failure() && github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const errPath = path.join(process.env.GITHUB_WORKSPACE, 'update-error.txt');
            let msg = "업데이트 실패. 로그:\n\n";
            if (fs.existsSync(errPath)) {
              msg += "```\n" + fs.readFileSync(errPath, 'utf8').slice(0, 3500) + "\n```\n";
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: msg
            });
